# Number of pod replicas
replicaCount: 1

image:
  # Override with your actual ghcr.io image path, e.g. ghcr.io/<owner>/whiskymap
  repository: ghcr.io/kschjeld/whiskymap
  pullPolicy: IfNotPresent
  # Overrides appVersion from Chart.yaml when set
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # nginx writes tmp files
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Gateway API HTTPRoute settings
httpRoute:
  enabled: true
  parentRefs:
    - name: internal-gateway
      namespace: platform
  hostname: whiskymap.dev.bt71.eu

nodeSelector: {}
tolerations: []
affinity: {}
